# Fixed Anatomical GNN Configuration
experiment_name: "opportunity_fixed_gnn"

# Reproducibility
seed: 42
deterministic: true

# Hardware
device: "cuda"          # Must be 'cuda' for full training. Refuses full training on CPU.
num_workers: 2
pin_memory: true

# Data
data_path: "data/processed/opportunity_locomotion_subset.npz"
output_dir: "results/fixed_gnn"
checkpoints_dir: "checkpoints"

# Architecture
num_classes: 5
sequence_length: 30
node_dim: 64
gcn_hidden_dim: 64
dropout: 0.2

# Training
batch_size: 64
epochs: 35
learning_rate: 0.001
weight_decay: 0.0001
patience: 8
clip_grad_norm: 1.0
